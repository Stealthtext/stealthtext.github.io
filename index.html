<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>StealthText API | Invisible Data Concealment</title>

    <style>
        :root {
            --bg: #f7f8f6;
            --text: #1a1a1a;
            --text-light: #666;
            --accent: #0f766e; /* Deep Teal */
            --accent-hover: #115e59;
            --border: #e5e7eb;
            --card-bg: #ffffff;
            --nav-bg: rgba(247, 248, 246, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
        }

        /* NAVIGATION */
        nav {
            position: sticky;
            top: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo span {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--accent);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-cta {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .status-dot {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .status-dot::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
        }

        .btn {
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        /* HERO SECTION */
        .hero {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .hero-text .tagline {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero-text .tagline::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
        }

        .hero h1 {
            font-size: 4rem;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 24px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 40px;
            max-width: 90%;
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn-secondary {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary:hover {
            color: var(--accent);
        }

        .hero-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-light);
        }

            background: linear-gradient(135deg, #091a1c 0%, #0d2e2f 100%);
            border-radius: 16px;
            aspect-ratio: 4/3;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

            height: 70%;
